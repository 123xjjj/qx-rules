name: Update Shadowrocket Rules

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天约 04:27
    - cron: "27 20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Shadowrocket rules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tmp_sr
          : > tmp_sr/all.list

          while IFS= read -r url || [ -n "$url" ]; do

            # 去掉 Windows 换行
            url="${url//$'\r'/}"

            # 跳过空行和注释
            if [[ -z "$url" || "$url" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            # 把 QX 地址自动转换成 Shadowrocket 地址
            if [[ "$url" == *"/rule/QuantumultX/"* ]]; then
              sr_url="${url/\/rule\/QuantumultX\//\/rule\/Shadowrocket\/}"
            elif [[ "$url" == *"/rule/Shadowrocket/"* ]]; then
              sr_url="$url"
            else
              echo "ERROR: Unsupported source URL:"
              echo "$url"
              exit 1
            fi

            echo "Downloading:"
            echo "$sr_url"

            file="tmp_sr/$(printf '%s' "$sr_url" | sha256sum | cut -d' ' -f1).list"

            curl \
              -fL \
              --retry 3 \
              --connect-timeout 15 \
              "$sr_url" \
              -o "$file"

            # 防止下载到 GitHub HTML 页面
            if grep -qiE '<!DOCTYPE[[:space:]]+html|<html' "$file"; then
              echo "ERROR: URL returned HTML:"
              echo "$sr_url"
              exit 1
            fi

            # 去掉原文件注释和空行，只留下真正规则
            sed 's/\r$//' "$file" \
              | grep -vE '^[[:space:]]*#' \
              | grep -vE '^[[:space:]]*$' \
              >> tmp_sr/all.list

            printf '\n' >> tmp_sr/all.list

          done < sources.txt

          {
            echo "# NAME: MyCNApps_Shadowrocket"
            echo "# GENERATED: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "# AUTO GENERATED BY GITHUB ACTIONS"
            echo

            # 全局排序 + 去重
            LC_ALL=C sort -u tmp_sr/all.list

          } > MyCNApps_Shadowrocket.list

      - name: Commit updated rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add MyCNApps_Shadowrocket.list

          if git diff --cached --quiet; then
            echo "No Shadowrocket rule changes."
          else
            git commit -m "Update Shadowrocket rules"
            git push
          fi
