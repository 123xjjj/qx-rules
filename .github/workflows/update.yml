name: Update QX Rules

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间大约凌晨 4:17
    # GitHub Actions cron 使用 UTC
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge rules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tmp
          : > tmp/all.list

          while IFS= read -r url || [ -n "$url" ]; do

            # 跳过空行和注释
            if [[ -z "$url" || "$url" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            echo "Downloading: $url"

            file="tmp/$(printf '%s' "$url" | sha256sum | cut -d' ' -f1).list"

            curl \
              -fL \
              --retry 3 \
              --connect-timeout 15 \
              "$url" \
              -o "$file"

            # 防止错误地下载到 GitHub HTML 页面
            if grep -qiE '<!DOCTYPE[[:space:]]+html|<html' "$file"; then
              echo "ERROR: URL returned HTML:"
              echo "$url"
              exit 1
            fi

            cat "$file" >> tmp/all.list
            printf '\n' >> tmp/all.list

          done < sources.txt

          {
            echo "# NAME: MyCNApps"
            echo "# GENERATED: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "# AUTO GENERATED BY GITHUB ACTIONS"
            echo

            awk -F',' '
              BEGIN {
                OFS=","
              }

              /^[[:space:]]*#/ {
                next
              }

              /^[[:space:]]*$/ {
                next
              }

              NF >= 2 {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                $3="DIRECT"

                print
              }
            ' tmp/all.list | sort -u

          } > MyCNApps.list

      - name: Commit updated rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add MyCNApps.list

          if git diff --cached --quiet; then
            echo "No rule changes."
          else
            git commit -m "Update QX rules"
            git push
          fi
